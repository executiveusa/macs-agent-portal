name: MAXX Pups CI

on:
  pull_request:
    paths:
      - "src/**"
      - "services/maxx-control-plane/**"
      - "services/hermes-runtime/profile/skills/maxx-pups/**"
      - "services/hermes-runtime/profile/pups/**"
      - "services/hermes-runtime/profile/config.yaml"
      - "services/hermes-runtime/maxx-entrypoint.sh"
      - "services/hermes-runtime/UPSTREAM.lock"
      - "supabase/migrations/*maxx_pup*.sql"
      - ".github/workflows/maxx-pups-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maxx-pups-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  control-plane:
    name: Control plane (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/maxx-control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/maxx-control-plane/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build