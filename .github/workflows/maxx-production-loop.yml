name: MAXX production loop

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: maxx-production-loop
  cancel-in-progress: true

jobs:
  production-proof:
    name: Production proof
    runs-on: ubuntu-latest
    environment: maxx-production
    timeout-minutes: 12
    env:
      FRONTEND_URL: https://macs-agent-portal-delta.vercel.app
      API_URL: https://api.thepaulieffect.com/maxx
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Reject production auth localhost regression
        shell: bash
        run: |
          set -euo pipefail
          ! grep -n 'localhost:3000' src/pages/SignIn.tsx
          grep -F 'emailRedirectTo: `${window.location.origin}/dashboard`' src/pages/SignIn.tsx
          grep -F 'redirectTo: `${window.location.origin}/dashboard`' src/pages/SignIn.tsx

      - name: Require Supabase production inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo 'VITE_SUPABASE_URL missing from maxx-production environment' >&2; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo 'VITE_SUPABASE_PUBLISHABLE_KEY missing from maxx-production environment' >&2; exit 1; }
          test "$SUPABASE_URL" = 'https://sxkemnqvxlgewrjplcag.supabase.co' || { echo 'Unexpected Supabase project URL' >&2; exit 1; }

      - name: Wait for Vercel production shell
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl -fsS --max-time 20 "$FRONTEND_URL/" -o /tmp/maxx-root.html \
              && grep -q '<div id="root"></div>' /tmp/maxx-root.html; then
              echo "Frontend shell verified on attempt $attempt"
              exit 0
            fi
            sleep 10
          done
          echo 'Production frontend did not become healthy' >&2
          exit 1

      - name: Verify SPA routes
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "$FRONTEND_URL/signin" -o /tmp/maxx-signin.html
          curl -fsS --max-time 20 "$FRONTEND_URL/dashboard" -o /tmp/maxx-dashboard.html
          grep -q '<div id="root"></div>' /tmp/maxx-signin.html
          grep -q '<div id="root"></div>' /tmp/maxx-dashboard.html

      - name: Verify MAXX public API health
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "$API_URL/health/live"
          curl -fsS --max-time 20 "$API_URL/health/ready"

      - name: Verify Supabase Google provider is enabled
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/auth/v1/settings" > /tmp/supabase-auth-settings.json
          node <<'NODE'
          const fs = require('fs');
          const settings = JSON.parse(fs.readFileSync('/tmp/supabase-auth-settings.json', 'utf8'));
          if (settings?.external?.google !== true) {
            console.error('Supabase Google provider is not enabled');
            process.exit(1);
          }
          console.log('Supabase Google provider enabled');
          NODE

      - name: Production proof result
        run: |
          echo 'MAXX production public proof passed.'
          echo 'This gate proves live shell, SPA routing, public API health, and Google provider enablement.'
          echo 'Interactive OAuth consent, magic-link destination, governed Pup delegation, approval stop/resume, and authenticated mission execution remain browser/runtime acceptance gates.'
