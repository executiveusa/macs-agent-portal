name: MAXX production loop

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: maxx-production-loop
  cancel-in-progress: true

jobs:
  production-proof:
    name: Production proof
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FRONTEND_URL: https://macs-agent-portal-delta.vercel.app
      API_URL: https://api.thepaulieffect.com/maxx
      SUPABASE_URL: https://sxkemnqvxlgewrjplcag.supabase.co

    steps:
      - uses: actions/checkout@v4

      - name: Reject production auth localhost regression
        shell: bash
        run: |
          set -euo pipefail
          ! grep -n 'localhost:3000' src/pages/SignIn.tsx
          grep -F 'emailRedirectTo: `${window.location.origin}/dashboard`' src/pages/SignIn.tsx
          grep -F 'redirectTo: `${window.location.origin}/dashboard`' src/pages/SignIn.tsx

      - name: Verify production identity
        shell: bash
        run: |
          set -euo pipefail
          test "$SUPABASE_URL" = 'https://sxkemnqvxlgewrjplcag.supabase.co'
          test "$FRONTEND_URL" = 'https://macs-agent-portal-delta.vercel.app'
          test "$API_URL" = 'https://api.thepaulieffect.com/maxx'

      - name: Wait for Vercel production shell
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl -fsS --max-time 20 "$FRONTEND_URL/" -o /tmp/maxx-root.html \
              && grep -q '<div id="root"></div>' /tmp/maxx-root.html; then
              echo "Frontend shell verified on attempt $attempt"
              exit 0
            fi
            sleep 10
          done
          echo 'Production frontend did not become healthy' >&2
          exit 1

      - name: Verify SPA routes
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "$FRONTEND_URL/signin" -o /tmp/maxx-signin.html
          curl -fsS --max-time 20 "$FRONTEND_URL/dashboard" -o /tmp/maxx-dashboard.html
          grep -q '<div id="root"></div>' /tmp/maxx-signin.html
          grep -q '<div id="root"></div>' /tmp/maxx-dashboard.html

      - name: Verify MAXX public API health
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "$API_URL/health/live"
          curl -fsS --max-time 20 "$API_URL/health/ready"

      - name: Verify Supabase Google OAuth redirect
        shell: bash
        run: |
          set -euo pipefail
          authorize_url="$SUPABASE_URL/auth/v1/authorize?provider=google&redirect_to=$(python -c "import urllib.parse; print(urllib.parse.quote('$FRONTEND_URL/dashboard', safe=''))")"
          headers=$(mktemp)
          curl -sS --max-time 20 -D "$headers" -o /dev/null "$authorize_url"
          status=$(awk 'toupper($1) ~ /^HTTP\// { code=$2 } END { print code }' "$headers")
          location=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^location:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")
          test "$status" = '302' || test "$status" = '303' || { echo "Expected OAuth redirect, got HTTP $status" >&2; cat "$headers" >&2; exit 1; }
          case "$location" in
            https://accounts.google.com/*|https://accounts.google.com/o/oauth2/*) ;;
            *) echo "Google provider did not redirect to Google: $location" >&2; exit 1 ;;
          esac
          echo 'Supabase Google provider redirects to Google.'

      - name: Production proof result
        run: |
          echo 'MAXX production public proof passed.'
          echo 'This gate proves live shell, SPA routing, public API health, and an enabled Google OAuth provider.'
          echo 'Interactive OAuth completion, magic-link destination, governed Pup delegation, approval stop/resume, and authenticated mission execution remain browser/runtime acceptance gates.'
