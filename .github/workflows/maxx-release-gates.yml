name: MAXX release gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Root secret file must not be tracked
        run: |
          test ! -f .env
          ! git ls-files --error-unmatch .env >/dev/null 2>&1

      - name: Validate JSON manifests and locks
        run: |
          python -m json.tool public/manifest.webmanifest >/dev/null
          python -m json.tool services/hermes-runtime/UPSTREAM.lock >/dev/null
          python -m json.tool services/nca-toolkit/UPSTREAM.lock >/dev/null
          python -m json.tool services/vision-gateway/UPSTREAM.lock >/dev/null
          python -m json.tool services/longrun-worker/UPSTREAM.lock >/dev/null
          python - <<'PY'
          import json,re
          lock=json.load(open('services/hermes-runtime/UPSTREAM.lock', encoding='utf-8'))
          assert re.fullmatch(r'[0-9a-f]{40}', lock['commit']), 'Hermes commit must be an immutable full SHA'
          assert lock.get('build_policy') == 'build_upstream_from_exact_commit_then_overlay_maxx'
          PY

      - name: Verify locked Hermes commit is fetchable
        run: |
          upstream=$(python -c "import json; print(json.load(open('services/hermes-runtime/UPSTREAM.lock'))['upstream'])")
          commit=$(python -c "import json; print(json.load(open('services/hermes-runtime/UPSTREAM.lock'))['commit'])")
          git init -q /tmp/hermes-pin
          git -C /tmp/hermes-pin remote add origin "$upstream"
          git -C /tmp/hermes-pin fetch --depth=1 origin "$commit"
          test "$(git -C /tmp/hermes-pin rev-parse FETCH_HEAD)" = "$commit"

      - name: Test second-brain ICM and OKF worker
        run: python -m unittest services/second-brain-worker/test_worker.py -v

      - name: Test sovereign MAXX sandbox
        run: |
          node --test services/maxx-sandbox/test/*.test.mjs
          docker build -f services/maxx-sandbox/Dockerfile -t maxx-sandbox:release-gate .
          ! grep -q '/var/run/docker.sock' services/maxx-control-plane/compose.coolify.yml

      - name: Validate shell entrypoints
        run: |
          bash -n services/hermes-runtime/maxx-entrypoint.sh
          bash -n services/hermes-runtime/bootstrap-maxx.sh
          bash -n services/hermes-runtime/build-pinned-image.sh
          bash -n services/nca-toolkit/bootstrap.sh
          bash -n deploy/maxx/install.sh
          bash -n deploy/maxx/verify.sh

      - name: Verify reusable MAXX skill catalog will be packaged
        run: |
          test -f skills/browser-hosting-deployer/SKILL.md
          test -f services/hermes-runtime/profile/skills/maxx-sandbox/SKILL.md
          for skill in pi-packages/maxx/skills/*; do
            test -f "$skill/SKILL.md"
          done
          grep -F 'COPY skills /opt/maxx-seed/repo-skills' services/hermes-runtime/Dockerfile.maxx
          grep -F 'COPY pi-packages/maxx/skills /opt/maxx-seed/maxx-specialist-skills' services/hermes-runtime/Dockerfile.maxx
          grep -F 'cp -R "$SEED_DIR/repo-skills/." "$DATA_DIR/skills/"' services/hermes-runtime/maxx-entrypoint.sh
          grep -F 'cp -R "$SEED_DIR/maxx-specialist-skills/." "$DATA_DIR/skills/"' services/hermes-runtime/maxx-entrypoint.sh
          grep -F 'cp -R "$REPO_ROOT/skills/." "$DATA_DIR/skills/"' services/hermes-runtime/bootstrap-maxx.sh
          grep -F 'cp -R "$REPO_ROOT/pi-packages/maxx/skills/." "$DATA_DIR/skills/"' services/hermes-runtime/bootstrap-maxx.sh

      - name: Reject mutable Hermes runtime images
        run: |
          if git grep -n -E 'nousresearch/hermes-agent:(latest|main)|HERMES_IMAGE:-nousresearch/hermes-agent' -- \
            services/hermes-runtime/Dockerfile.maxx \
            services/hermes-runtime/docker-compose.yml \
            'services/hermes-runtime/*.sh' \
            services/maxx-control-plane/compose.coolify.yml \
            'deploy/maxx/*.sh'; then
            echo 'MAXX runtime must be built from the immutable UPSTREAM.lock commit.' >&2
            exit 1
          fi

      - name: Validate full Coolify compose expansion
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test-service-role
          STACY_ALLOWED_EMAILS: stacy@example.com
          MAXX_API_KEY: 0123456789abcdef0123456789abcdef
          MAXX_HERMES_API_KEY: abcdef0123456789abcdef0123456789
          MAXX_HERMES_IMAGE: maxx-hermes:test-pinned
          NCA_TOOLKIT_API_KEY: 11111111111111112222222222222222
          MAXX_SANDBOX_KEY: 33333333333333334444444444444444
          CONTROL_TOWER_ALLOWED_ORIGINS: https://maxx.example.com
        run: docker compose -f services/maxx-control-plane/compose.coolify.yml config --quiet

      - name: Enforce personal Hermes isolation
        run: |
          if git grep -n 'executiveusa/pauli-hermes-agent' -- \
            '*.ts' '*.tsx' '*.js' '*.mjs' '*.cjs' '*.py' '*.sh' '*.yml' '*.yaml' \
            'Dockerfile*' 'package.json' 'package-lock.json' 'pnpm-lock.yaml' 'yarn.lock' \
            ':!*.md' \
            ':!services/hermes-runtime/UPSTREAM.lock' \
            ':!.github/workflows/maxx-release-gates.yml'; then
            echo 'Bambu personal Hermes must not appear in executable/runtime dependency files.' >&2
            exit 1
          fi
