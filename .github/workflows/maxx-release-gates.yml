name: MAXX release gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Root secret file must not be tracked
        run: |
          test ! -f .env
          ! git ls-files --error-unmatch .env >/dev/null 2>&1

      - name: Validate JSON manifests and locks
        run: |
          python -m json.tool public/manifest.webmanifest >/dev/null
          python -m json.tool services/hermes-runtime/UPSTREAM.lock >/dev/null
          python -m json.tool services/nca-toolkit/UPSTREAM.lock >/dev/null
          python -m json.tool services/vision-gateway/UPSTREAM.lock >/dev/null
          python -m json.tool services/longrun-worker/UPSTREAM.lock >/dev/null

      - name: Test second-brain ICM and OKF worker
        run: python -m unittest services/second-brain-worker/test_worker.py -v

      - name: Validate shell entrypoints
        run: |
          bash -n services/hermes-runtime/maxx-entrypoint.sh
          bash -n services/hermes-runtime/bootstrap-maxx.sh
          bash -n services/nca-toolkit/bootstrap.sh
          bash -n deploy/maxx/verify.sh

      - name: Validate full Coolify compose expansion
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test-service-role
          STACY_ALLOWED_EMAILS: stacy@example.com
          MAXX_API_KEY: 0123456789abcdef0123456789abcdef
          MAXX_HERMES_API_KEY: abcdef0123456789abcdef0123456789
          NCA_TOOLKIT_API_KEY: 11111111111111112222222222222222
          CONTROL_TOWER_ALLOWED_ORIGINS: https://maxx.example.com
        run: docker compose -f services/maxx-control-plane/compose.coolify.yml config --quiet

      - name: Enforce personal Hermes isolation
        run: |
          if git grep -n 'executiveusa/pauli-hermes-agent' -- \
            '*.ts' '*.tsx' '*.js' '*.mjs' '*.cjs' '*.py' '*.sh' '*.yml' '*.yaml' \
            'Dockerfile*' 'package.json' 'package-lock.json' 'pnpm-lock.yaml' 'yarn.lock' \
            ':!*.md' \
            ':!services/hermes-runtime/UPSTREAM.lock' \
            ':!.github/workflows/maxx-release-gates.yml'; then
            echo 'Bambu personal Hermes must not appear in executable/runtime dependency files.' >&2
            exit 1
          fi
