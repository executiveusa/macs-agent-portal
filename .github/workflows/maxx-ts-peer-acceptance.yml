name: MAXX TypeScript repair acceptance

on:
  pull_request:
    branches:
      - fix/ts-peer-align
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/maxx-ts-peer-acceptance.yml

permissions:
  contents: read

jobs:
  frontend-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
