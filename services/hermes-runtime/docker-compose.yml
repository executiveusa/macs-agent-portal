services:
  maxx-hermes:
    build:
      context: ../..
      dockerfile: services/hermes-runtime/Dockerfile.maxx
      args:
        HERMES_IMAGE: "${HERMES_IMAGE:-nousresearch/hermes-agent:latest}"
    image: maxx-hermes:local
    container_name: maxx-hermes
    restart: unless-stopped
    ports:
      - "${MAXX_HERMES_BIND_PORT:-8642}:8642"
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: "${MAXX_HERMES_API_KEY:?set MAXX_HERMES_API_KEY in the deployment secret store}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
      KIMI_API_KEY: "${KIMI_API_KEY:-}"
      XAI_API_KEY: "${XAI_API_KEY:-}"
      NCA_TOOLKIT_URL: "${NCA_TOOLKIT_URL:-}"
      NCA_TOOLKIT_API_KEY: "${NCA_TOOLKIT_API_KEY:-}"
    volumes:
      - "${MAXX_HERMES_DATA_DIR:-./.runtime/hermes}:/opt/data"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
