services:
  maxx-hermes:
    image: nousresearch/hermes-agent:latest
    container_name: maxx-hermes
    restart: unless-stopped
    ports:
      - "${MAXX_HERMES_BIND_PORT:-8642}:8642"
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: "${MAXX_HERMES_API_KEY:?set MAXX_HERMES_API_KEY in the deployment secret store}"
    volumes:
      - "${MAXX_HERMES_DATA_DIR:-./.runtime/hermes}:/opt/data"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    command: ["gateway", "run"]
