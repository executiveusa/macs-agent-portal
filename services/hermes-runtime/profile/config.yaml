tool_loop_guardrails:
  hard_stop_enabled: true
  hard_stop_after:
    exact_failure: 5
    idempotent_no_progress: 5

gateway:
  multiplex_profiles: true
  multiplex_profile_allowlist:
    - chief-pup
    - superdoer
    - business-pup

mcp_servers:
  maxx-control-plane:
    command: "python"
    args: ["/opt/maxx-seed/profile/mcp/maxx_control_plane.py"]
    env:
      MAXX_CONTROL_PLANE_INTERNAL_URL: "${MAXX_CONTROL_PLANE_INTERNAL_URL}"
      MAXX_HERMES_TOOL_KEY: "${MAXX_HERMES_TOOL_KEY}"
    enabled: true
    supports_parallel_tool_calls: false

  # Optional connected-app surfaces. maxx-entrypoint.sh enables these only
  # when the matching credential is present so missing keys never crash-loop.
  composio:
    url: "https://connect.composio.dev/mcp"
    headers:
      x-consumer-api-key: "${COMPOSIO_CONSUMER_KEY}"
    enabled: false

  latitude:
    url: "https://api.latitude.so/v1/mcp"
    headers:
      Authorization: "Bearer ${LATITUDE_API_KEY}"
    enabled: false

  agentmail:
    url: "https://mcp.agentmail.to/mcp"
    headers:
      x-api-key: "${AGENTMAIL_API_KEY}"
    enabled: false

# Provider/model credentials and defaults are deployment state, not repository state.
# Configure them in the isolated MAXX Hermes data volume / secret store.
# MAXX Mode is requested per turn through Hermes model_options and does not
# give the browser or customer direct access to provider credentials.
