services:
  maxx-hermes:
    build:
      context: ../..
      dockerfile: services/hermes-runtime/Dockerfile.maxx
      args:
        HERMES_IMAGE: "${HERMES_IMAGE:-nousresearch/hermes-agent:latest}"
    restart: unless-stopped
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: "${MAXX_HERMES_API_KEY:?required}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
      KIMI_API_KEY: "${KIMI_API_KEY:-}"
      XAI_API_KEY: "${XAI_API_KEY:-}"
      NCA_TOOLKIT_URL: "http://maxx-media:8080"
      NCA_TOOLKIT_API_KEY: "${NCA_TOOLKIT_API_KEY:?required}"
    volumes:
      - maxx-hermes-data:/opt/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  maxx-media:
    build:
      context: "https://github.com/stephengpope/no-code-architects-toolkit.git#d9bb5679e203e6b5d3b3c2b9ab848a289c645024"
    restart: unless-stopped
    environment:
      API_KEY: "${NCA_TOOLKIT_API_KEY:?required}"
      LOCAL_STORAGE_PATH: /tmp
      MAX_QUEUE_LENGTH: "${NCA_MAX_QUEUE_LENGTH:-10}"
      GUNICORN_WORKERS: "${NCA_GUNICORN_WORKERS:-2}"
      GUNICORN_TIMEOUT: "${NCA_GUNICORN_TIMEOUT:-600}"
    volumes:
      - maxx-media-temp:/tmp
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; r=urllib.request.Request('http://127.0.0.1:8080/v1/toolkit/test', headers={'x-api-key':'$${API_KEY}'}); urllib.request.urlopen(r, timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  maxx-control-plane:
    build:
      context: ../..
      dockerfile: services/maxx-control-plane/Dockerfile
    restart: unless-stopped
    depends_on:
      maxx-hermes:
        condition: service_healthy
      maxx-media:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      MAXX_ICM_ROOT: /data/maxx
      SUPABASE_URL: "${SUPABASE_URL:?required}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:-}"
      STACY_ALLOWED_EMAILS: "${STACY_ALLOWED_EMAILS:?required}"
      MAXX_API_KEY: "${MAXX_API_KEY:?required}"
      CONTROL_TOWER_ALLOWED_ORIGINS: "${CONTROL_TOWER_ALLOWED_ORIGINS:?required}"
      MAXX_HERMES_ENABLED: "true"
      MAXX_HERMES_ENDPOINT: http://maxx-hermes:8642
      MAXX_HERMES_API_KEY: "${MAXX_HERMES_API_KEY:?required}"
      MAXX_PRODUCTION_MUTATIONS_ENABLED: "true"
      MAXX_EMERGENCY_DISABLE: "false"
      MAXX_VOICE_ENABLED: "${MAXX_VOICE_ENABLED:-false}"
      MAXX_VISION_ENABLED: "false"
      MAXX_BROWSER_ENABLED: "${MAXX_BROWSER_ENABLED:-false}"
      MAXX_BROWSER_MUTATIONS_ENABLED: "${MAXX_BROWSER_MUTATIONS_ENABLED:-false}"
      MAXX_MEMORY_ENABLED: "${MAXX_MEMORY_ENABLED:-true}"
      MAXX_SCHEDULER_ENABLED: "${MAXX_SCHEDULER_ENABLED:-true}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
    ports:
      - "8787"
    volumes:
      - maxx-icm:/data/maxx
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  maxx-icm:
  maxx-hermes-data:
  maxx-media-temp:
