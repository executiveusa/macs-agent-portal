services:
  maxx-control-plane:
    expose:
      - "8787"

  maxx-edge:
    build:
      context: ../..
      dockerfile: deploy/flywheel/Dockerfile.edge
      args:
        VITE_SUPABASE_URL: "${VITE_SUPABASE_URL:?required}"
        VITE_SUPABASE_PUBLISHABLE_KEY: "${VITE_SUPABASE_PUBLISHABLE_KEY:?required}"
        VITE_CONTROL_TOWER_API_URL: "https://${MAXX_DOMAIN:?required}"
    restart: unless-stopped
    depends_on:
      maxx-control-plane:
        condition: service_healthy
    environment:
      MAXX_DOMAIN: "${MAXX_DOMAIN:?required}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - maxx-caddy-data:/data
      - maxx-caddy-config:/config

volumes:
  maxx-caddy-data:
  maxx-caddy-config:
